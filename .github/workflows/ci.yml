name: repository-gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gate-self-checks:
        description: 'Also run the Channel 0.2 probe corpus and gate-coverage measure'
        type: boolean
        default: false
  schedule:
    # The floor under the gate self-checks, not the plan for running them. A probe whose anchor a
    # correction moved stops measuring silently and AO3 found four that had, so moving the corpus off
    # every push reopens that gap and something has to close it without being asked.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  full-gate:
    name: Full gate (.NET ${{ matrix.lane }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: first-feature-band
            dotnet: '10.0.100'
          - lane: current-feature-band
            dotnet: '10.0.x'
            quality: preview

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install supported .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet }}
          dotnet-quality: ${{ matrix.quality }}

      - name: Run build, complete test inventory, cross-process providers, and repository controls
        shell: powershell
        # The gate self-checks -- the Channel 0.2 probe corpus and gate-coverage measure -- are 411 of
        # the 442 seconds this gate's PowerShell half takes, so they run on the schedule and on request
        # rather than on every push. AT7, and build/verify-gate-self-checks.ps1 states what that gives up.
        run: |
          $selfChecks = ('${{ github.event_name }}' -eq 'schedule') -or ('${{ inputs.gate-self-checks }}' -eq 'true')
          if ($selfChecks) { .\build\verify-interchange.ps1 -IncludeGateSelfChecks }
          else { .\build\verify-interchange.ps1 }
